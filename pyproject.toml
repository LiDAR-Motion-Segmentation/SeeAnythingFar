[build-system]
requires = ["setuptools>=61.0", "torch>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seeanythingfar"
version = "0.1.0"
description = "Long-range multi-modal 3D perception for outdoor scenes."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "pytorch-lightning",
    "hydra-core",
    "numpy",
    "scipy",
    "timm",      # For pulling vision models if needed
    "einops"     # Crucial for reshaping ViT tokens
]