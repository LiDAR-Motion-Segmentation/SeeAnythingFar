[build-system]
requires = ["setuptools>=61.0", "torch>=2.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seeanythingfar"
version = "0.1.0"
description = "Long-range multi-modal 3D perception for outdoor scenes."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "pytorch-lightning>=2.0",
    "hydra-core>=1.3",
    "numpy",
    "scipy",     # Hungarian matching
    "timm>=1.0.20",  # DINOv3 ViTs
    "einops",    # Crucial for reshaping ViT tokens
    "pillow",
    "matplotlib",
    "tqdm",
]

[project.optional-dependencies]
# nuScenes info generation + official evaluation
nuscenes = ["nuscenes-devkit", "pyquaternion"]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
